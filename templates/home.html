{% extends "base.html" %}
{% block title %}Главная{% endblock %}
{% block content %}
<div class="home-page-bg">
    <div class="home-overlay"></div>
    <div class="home-content">
        <div class="text-center py-5">
            <h1 class="mb-3">Личный дневник</h1>
            <p class="lead text-muted">Ваши мысли — только ваши. Запишите их сегодня.</p>
            {% if not user.is_authenticated %}
                <a href="{% url 'accounts:signup' %}" class="btn btn-success btn-lg me-2">Зарегистрироваться</a>
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-success btn-lg">Войти</a>
            {% else %}
                <a href="{% url 'diary:entry-list' %}" class="btn btn-success btn-lg">Мои записи</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
