{% extends "base.html" %}
{% block title %}Удаление{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger bg-light">
            <div class="card-body text-center p-4">
                <h3 class="text-danger mb-3">Удалить запись?</h3>
                <p class="mb-4">«{{ object.title }}» будет удалена безвозвратно.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg px-4">Да, удалить</button>
                    <a href="{% url 'diary:entry-list' %}" class="btn btn-outline-secondary btn-lg ms-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
